<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My S3 Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&display=swap" rel="stylesheet">
  <style>
  body { font-family: "Edu QLD Hand", cursive; }
  </style>
</head>
<body>
  <h1>Hello from S3!</h1>
  <p>This page is hosted in an S3 bucket.</p>
  <script type="text/javascript">
  
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://391d5bful6.execute-api.us-east-1.amazonaws.com/prod/hello", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = () => {
      if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
          var results = JSON.parse(xhr.responseText);
          console.log('results', results);
      }
    };
    xhr.send();
  </script>
</body>
</html>
